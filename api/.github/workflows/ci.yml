name: API CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop

env:
  NODE_VERSION: '18.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-api

jobs:
  # ============================================================================
  # LINT & TYPE CHECKING
  # ============================================================================
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'api/yarn.lock'

      - name: 📚 Install dependencies
        working-directory: ./api
        run: yarn install --frozen-lockfile

      - name: 🔍 Run ESLint
        working-directory: ./api
        run: yarn lint:check

      - name: 🏷️ Run TypeScript check
        working-directory: ./api
        run: yarn typecheck

      - name: 📄 Check Prettier formatting
        working-directory: ./api
        run: yarn format:check

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'api/yarn.lock'

      - name: 📚 Install dependencies
        working-directory: ./api
        run: yarn install --frozen-lockfile

      - name: 🧪 Run unit tests
        working-directory: ./api
        run: yarn test:unit
        env:
          NODE_ENV: test

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./api/coverage/lcov.info
          flags: api-unit
          name: api-unit-tests
          fail_ci_if_error: false

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tennisshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/tennisshop_test
      DATABASE_URL_TEST: postgresql://test_user:test_password@localhost:5432/tennisshop_test
      NODE_ENV: test
      LOG_LEVEL: error

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'api/yarn.lock'

      - name: 📚 Install dependencies
        working-directory: ./api
        run: yarn install --frozen-lockfile

      - name: 🗄️ Setup database
        working-directory: ./api
        run: |
          yarn db:generate
          yarn db:migrate:deploy
          yarn db:seed

      - name: 🔗 Run integration tests
        working-directory: ./api
        run: yarn test:integration

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./api/coverage/lcov.info
          flags: api-integration
          name: api-integration-tests
          fail_ci_if_error: false

  # ============================================================================
  # E2E TESTS
  # ============================================================================
  e2e-tests:
    name: 🚀 E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tennisshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/tennisshop_test
      DATABASE_URL_TEST: postgresql://test_user:test_password@localhost:5432/tennisshop_test
      NODE_ENV: test
      PORT: 3001
      LOG_LEVEL: error
      CORS_ORIGIN: http://localhost:3000

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'api/yarn.lock'

      - name: 📚 Install dependencies
        working-directory: ./api
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build application
        working-directory: ./api
        run: yarn build

      - name: 🗄️ Setup database
        working-directory: ./api
        run: |
          yarn db:generate
          yarn db:migrate:deploy
          yarn db:seed

      - name: 🚀 Run E2E tests
        working-directory: ./api
        run: yarn test:e2e

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./api/coverage/lcov.info
          flags: api-e2e
          name: api-e2e-tests
          fail_ci_if_error: false

  # ============================================================================
  # SECURITY AUDIT
  # ============================================================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'api/yarn.lock'

      - name: 📚 Install dependencies
        working-directory: ./api
        run: yarn install --frozen-lockfile

      - name: 🔍 Audit dependencies
        working-directory: ./api
        run: yarn audit --level moderate
        continue-on-error: true

      - name: 🔒 Run Snyk security check
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=api/package.json
        continue-on-error: true

  # ============================================================================
  # DOCKER BUILD
  # ============================================================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 🔑 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: 📋 Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  # ============================================================================
  # DEPLOYMENT (opcional - solo en main)
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs:
      [
        lint-and-typecheck,
        unit-tests,
        integration-tests,
        e2e-tests,
        docker-build,
      ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
      - name: 🚀 Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          # Aquí irían los comandos específicos de deployment
          # Por ejemplo: kubectl, docker-compose, terraform, etc.

      - name: 📢 Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            API deployment to staging: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================================================
  # PERFORMANCE TESTS (opcional)
  # ============================================================================
  performance-tests:
    name: ⚡ Performance Tests
    runs-on: ubuntu-latest
    needs: [e2e-tests]
    if: github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tennisshop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'api/yarn.lock'

      - name: 📚 Install dependencies
        working-directory: ./api
        run: yarn install --frozen-lockfile

      - name: 🏗️ Build application
        working-directory: ./api
        run: yarn build

      - name: 🗄️ Setup database
        working-directory: ./api
        run: |
          yarn db:generate
          yarn db:migrate:deploy
          yarn db:seed:performance
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/tennisshop_test

      - name: ⚡ Run performance tests
        working-directory: ./api
        run: |
          # Instalar Artillery para load testing
          npm install -g artillery

          # Ejecutar tests de carga
          artillery run tests/performance/load-test.yml

      - name: 📊 Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: ./api/performance-results/
          retention-days: 30
