name: Web CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - develop
      - 'feature/**'
      - 'hotfix/**'
  pull_request:
    branches: 
      - main
      - develop

env:
  NODE_VERSION: '18.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-web

jobs:
  # ============================================================================
  # LINT & TYPE CHECKING
  # ============================================================================
  lint-and-typecheck:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'web/yarn.lock'
          
      - name: 📚 Install dependencies
        working-directory: ./web
        run: yarn install --frozen-lockfile
        
      - name: 🔍 Run ESLint
        working-directory: ./web
        run: yarn lint:check
        
      - name: 🏷️ Run TypeScript check
        working-directory: ./web
        run: yarn typecheck
        
      - name: 📄 Check Prettier formatting
        working-directory: ./web
        run: yarn format --check
        
      - name: 📊 Unused dependencies check
        working-directory: ./web
        run: npx depcheck --ignore-patterns="*.test.*,*.spec.*"
        continue-on-error: true

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'web/yarn.lock'
          
      - name: 📚 Install dependencies
        working-directory: ./web
        run: yarn install --frozen-lockfile
        
      - name: 🧪 Run unit tests
        working-directory: ./web
        run: yarn test:unit --reporter=verbose --coverage
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          
      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./web/coverage/lcov.info
          flags: web-unit
          name: web-unit-tests
          fail_ci_if_error: false
          
      - name: 💾 Cache test results
        uses: actions/cache@v3
        with:
          path: ./web/coverage
          key: ${{ runner.os }}-unit-coverage-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-unit-coverage-

  # ============================================================================
  # E2E TESTS
  # ============================================================================
  e2e-tests:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project: [chromium, firefox, webkit]
        
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'web/yarn.lock'
          
      - name: 📚 Install dependencies
        working-directory: ./web
        run: yarn install --frozen-lockfile
        
      - name: 📦 Install Playwright browsers
        working-directory: ./web
        run: yarn playwright:install ${{ matrix.project }}
        
      - name: 🏗️ Build Next.js application
        working-directory: ./web
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          
      - name: 🎭 Run E2E tests
        working-directory: ./web
        run: yarn test:e2e --project=${{ matrix.project }}
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          
      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: ./web/playwright-report/
          retention-days: 30
          
      - name: 📹 Upload test videos
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-videos-${{ matrix.project }}
          path: ./web/test-results/
          retention-days: 7

  # ============================================================================
  # E2E TESTS WITH MOBILE
  # ============================================================================
  e2e-mobile-tests:
    name: 📱 E2E Mobile Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        device: ['Mobile Chrome', 'Mobile Safari']
        
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'web/yarn.lock'
          
      - name: 📚 Install dependencies
        working-directory: ./web
        run: yarn install --frozen-lockfile
        
      - name: 📦 Install Playwright browsers
        working-directory: ./web
        run: yarn playwright:install
        
      - name: 🏗️ Build Next.js application
        working-directory: ./web
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          
      - name: 📱 Run mobile E2E tests
        working-directory: ./web
        run: yarn test:e2e --project="${{ matrix.device }}"
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          
      - name: 📊 Upload mobile test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: mobile-test-results-${{ matrix.device }}
          path: ./web/test-results/
          retention-days: 7

  # ============================================================================
  # LIGHTHOUSE PERFORMANCE TESTS
  # ============================================================================
  lighthouse-tests:
    name: 🔍 Lighthouse Performance
    runs-on: ubuntu-latest
    needs: [unit-tests]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'web/yarn.lock'
          
      - name: 📚 Install dependencies
        working-directory: ./web
        run: yarn install --frozen-lockfile
        
      - name: 🏗️ Build Next.js application
        working-directory: ./web
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          
      - name: 🚀 Start Next.js server
        working-directory: ./web
        run: |
          yarn start &
          sleep 10
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          
      - name: 🔍 Run Lighthouse CI
        run: |
          npm install -g @lhci/cli
          lhci collect --url http://localhost:3000
          lhci assert --preset lighthouse:recommended
        continue-on-error: true
        
      - name: 📊 Upload Lighthouse results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: lighthouse-results
          path: ./.lighthouseci/
          retention-days: 30

  # ============================================================================
  # SECURITY AUDIT
  # ============================================================================
  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'web/yarn.lock'
          
      - name: 📚 Install dependencies
        working-directory: ./web
        run: yarn install --frozen-lockfile
        
      - name: 🔍 Audit dependencies
        working-directory: ./web
        run: yarn audit --level moderate
        continue-on-error: true
        
      - name: 🔒 Run Snyk security check
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=web/package.json
        continue-on-error: true
        
      - name: 🛡️ Run CodeQL analysis
        uses: github/codeql-action/init@v2
        with:
          languages: javascript
          
      - name: 🛡️ Perform CodeQL analysis
        uses: github/codeql-action/analyze@v2

  # ============================================================================
  # BUILD VERIFICATION
  # ============================================================================
  build-verification:
    name: 🏗️ Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    
    strategy:
      matrix:
        node-version: ['18.x', '20.x']
        
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'yarn'
          cache-dependency-path: 'web/yarn.lock'
          
      - name: 📚 Install dependencies
        working-directory: ./web
        run: yarn install --frozen-lockfile
        
      - name: 🏗️ Build application
        working-directory: ./web
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          
      - name: 🧪 Test build output
        working-directory: ./web
        run: |
          # Verificar que los archivos esenciales existan
          test -d .next/
          test -f .next/BUILD_ID
          test -d .next/static/
          
      - name: 📦 Analyze bundle size
        working-directory: ./web
        run: |
          # Instalar bundle analyzer
          npm install -g @next/bundle-analyzer
          
          # Generar análisis
          ANALYZE=true yarn build
        continue-on-error: true

  # ============================================================================
  # DOCKER BUILD
  # ============================================================================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          
      - name: 🔑 Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:3001' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          
      - name: 🧪 Test Docker image
        run: |
          # Ejecutar contenedor para verificar que funciona
          docker run --rm -d -p 3000:3000 --name test-container \
            -e NEXT_PUBLIC_API_BASE_URL=http://localhost:3001 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          
          # Esperar que el contenedor esté listo
          sleep 15
          
          # Verificar que responde
          curl -f http://localhost:3000 || exit 1
          
          # Limpiar
          docker stop test-container
          
      - name: 📋 Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}

  # ============================================================================
  # VISUAL REGRESSION TESTS (opcional)
  # ============================================================================
  visual-regression:
    name: 👁️ Visual Regression Tests
    runs-on: ubuntu-latest
    needs: [build-verification]
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: 'web/yarn.lock'
          
      - name: 📚 Install dependencies
        working-directory: ./web
        run: yarn install --frozen-lockfile
        
      - name: 🏗️ Build application
        working-directory: ./web
        run: yarn build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001
          
      - name: 👁️ Run visual regression tests
        working-directory: ./web
        run: |
          # Instalar herramienta de visual testing (ejemplo: Percy, Chromatic, etc.)
          # npx percy exec -- yarn test:e2e --project=chromium
          echo "Visual regression tests would run here"
        continue-on-error: true

  # ============================================================================
  # DEPLOYMENT
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests, e2e-tests, build-verification, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
      - name: 🚀 Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "Docker image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main"
          # Aquí irían los comandos específicos de deployment
          # Por ejemplo: kubectl, docker-compose, Vercel, Netlify, etc.
          
      - name: 🧪 Health check
        run: |
          echo "🏥 Running health checks..."
          # curl -f https://staging.tennisshop.com
          
      - name: 🔍 Lighthouse post-deploy check
        run: |
          echo "🔍 Running post-deployment Lighthouse check..."
          # npx lighthouse https://staging.tennisshop.com --output json
          
      - name: 📢 Notify deployment
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          text: |
            Web deployment to staging: ${{ job.status }}
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

  # ============================================================================
  # CLEANUP
  # ============================================================================
  cleanup:
    name: 🧹 Cleanup
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: 🧹 Clean up artifacts
        uses: geekyeggo/delete-artifact@v2
        with:
          name: |
            playwright-report-*
            lighthouse-results
            mobile-test-results-*
          failOnError: false